<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saut des Cactus</title>
  <style>
    :html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(#74c7ec 0 65%, #f4d58d 65%);
    }
    body { text-align: center; }
    h1 { margin: 18px 0 8px; color: #263238; }
    #jeu {
      position: relative;
      width: min(900px, 94vw);
      height: 420px;
      margin: 10px auto;
      border: 4px solid #263238;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(#74c7ec 0 68%, #f4d58d 68%);
      box-shadow: 0 12px 30px #0003;
    }
    #soleil {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ffe066;
      right: 60px;
      top: 38px;
      box-shadow: 0 0 25px #fff7;
    }
    #score, #meilleur {
      position: absolute;
      top: 12px;
      z-index: 3;
      font-weight: bold;
      color: #263238;
    }
    #score { left: 18px; }
    #meilleur { right: 18px; }
    #sol {
      position: absolute;
      height: 6px;
      width: 100%;
      bottom: 67px;
      background: #8d5524;
    }
    #joueur {
      position: absolute;
      left: 90px;
      bottom: 73px;
      width: 52px;
      height: 68px;
      z-index: 2;
    }
    #joueur:before {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      left: 5px;
      top: 0;
      border-radius: 12px 12px 8px 8px;
      background: #40ad54;
      border: 3px solid #1f7533;
    }
    #joueur:after {
      content: "";
      position: absolute;
      width: 40px;
      height: 28px;
      left: 6px;
      bottom: 0;
      background: #40ad54;
      border: 3px solid #1f7533;
      border-top: 0;
    }
    .oeil {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #263238;
      left: 31px;
      top: 13px;
      z-index: 3;
    }
    .cactus {
      position: absolute;
      bottom: 73px;
      width: 38px;
      height: 58px;
      background: #2e8b57;
      border: 3px solid #155d38;
      border-radius: 8px 8px 3px 3px;
      z-index: 2;
    }
    .cactus:before, .cactus:after {
      content: "";
      position: absolute;
      width: 15px;
      height: 28px;
      bottom: 14px;
      background: #2e8b57;
      border: 3px solid #155d38;
    }
    .cactus:before { left: -16px; border-radius: 10px 0 4px 10px; }
    .cactus:after { right: -16px; border-radius: 0 10px 10px 4px; }
    #depart, #rejouer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #263238;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #111;
    }
    #rejouer { display: none; }
    #aide { margin: 8px; color: #263238; }
  </style>
</head>
<body>
  <h1>🏜️ Saut des Cactus</h1>
  <div id="jeu">
    <div id="soleil"></div>
    <div id="score">Score : 0</div>
    <div id="meilleur">Meilleur : 0</div>
    <div id="sol"></div>
    <div id="joueur"><div class="oeil"></div></div>
    <button id="depart">Commencer</button>
    <button id="rejouer">Rejouer</button>
  </div>
  <p id="aide">Appuie sur <b>ESPACE</b> ou sur le personnage pour sauter !</p>

  <script>
    const jeu = document.getElementById("jeu");
    const joueur = document.getElementById("joueur");
    const depart = document.getElementById("depart");
    const rejouer = document.getElementById("rejouer");
    const scoreTexte = document.getElementById("score");
    const meilleurTexte = document.getElementById("meilleur");

    let y = 0;
    let vitesseY = 0;
    let enSaut = false;
    let actif = false;
    let fini = false;
    let score = 0;
    let meilleur = Number(localStorage.getItem("meilleurCactus") || 0);
    let vitesse = 6;
    let cactuses = [];
    let derniereCactus = 0;
    let dernierTemps = 0;
    meilleurTexte.textContent = "Meilleur : " + meilleur;

    function saut() {
      if (actif && !enSaut) {
        vitesseY = 13;
        enSaut = true;
      }
mfddsjsbgdsbjfbshbdf
    function creerCactus() {
      const c = document.createElement("div");
      c.className = "cactus";
      c.style.left = jeu.clientWidth + "px";
      jeu.appendChild(c);
      cactuses.push(c);
    }

    function collision(c) {
      const j = joueur.getBoundingClientRect();
      const k = c.getBoundingClientRect();
      return j.left + 8 < k.right - 5 && j.right - 8 > k.left + 5 && j.bottom - 5 > k.top + 8;
    }

    function finJeu() {
      actif = false;
      fini = true;
      if (score > meilleur) {
        meilleur = score;
        localStorage.setItem("meilleurCactus", meilleur);
      }
      meilleurTexte.textContent = "Meilleur : " + meilleur;
      rejouer.style.display = "block";
    }

    function boucle(temps) {
      if (!actif) return;
      const delta = Math.min((temps - dernierTemps) / 16.67, 2);
      dernierTemps = temps;

      if (enSaut) {
        y += vitesseY * delta;
        vitesseY -= 0.75 * delta;
        if (y <= 0) {
          y = 0;
          vitesseY = 0;
          enSaut = false;
        }
        joueur.style.bottom = (73 + y) + "px";
      }

      derniereCactus += delta;
      if (derniereCactus > 75 + Math.random() * 55) {
        creerCactus();
        derniereCactus = 0;
      }

      cactuses.forEach(c => {
        c.style.left = (parseFloat(c.style.left) - vitesse * delta) + "px";
        if (collision(c)) finJeu();
      });
      cactuses = cactuses.filter(c => {
        if (parseFloat(c.style.left) < -60) {
          c.remove();
          return false;
        }
        return true;
      });

      score += delta * 0.12;
      scoreTexte.textContent = "Score : " + Math.floor(score);
      vitesse = Math.min(13, 6 + score / 100);

      if (!fini) requestAnimationFrame(boucle);
    }

    depart.addEventListener("click", demarrer);
    rejouer.addEventListener("click", demarrer);
    joueur.addEventListener("pointerdown", e => { e.prevent; saut(); });
    window.addEventListener("keydown", e => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        saut();
      }
    });
  </script>
</body>
</html>
